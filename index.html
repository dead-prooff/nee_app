<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    `flutter build web --base-href /nee_app/` reemplaza este valor por la
    ruta donde se publica (en GitHub Pages: /<nombre-del-repo>/).
  -->
  <base href="/nee_app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aprendé guaraní y jopara con frases de la vida real.">
  <meta name="theme-color" content="#1B7F4F">

  <!-- Vista previa del link (WhatsApp, Facebook, X...). La imagen es
       web/og-image.png (1200x630) y tiene que ir con la dirección completa. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ñe'ẽ">
  <meta property="og:locale" content="es_PY">
  <meta property="og:title" content="Ñe'ẽ – Aprendé guaraní y jopara">
  <meta property="og:description" content="Lecciones de 5 minutos, duelos con amigos y tereré. ¡Gratis!">
  <meta property="og:url" content="https://dead-prooff.github.io/nee_app/">
  <meta property="og:image" content="https://dead-prooff.github.io/nee_app/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ñe'ẽ: aprendé guaraní y jopara">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ñe'ẽ – Aprendé guaraní y jopara">
  <meta name="twitter:description" content="Lecciones de 5 minutos, duelos con amigos y tereré. ¡Gratis!">
  <meta name="twitter:image" content="https://dead-prooff.github.io/nee_app/og-image.png">

  <!-- iOS: permite "Agregar a pantalla de inicio" desde Safari -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ñe'ẽ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ñe'ẽ: aprendé guaraní</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Pantalla de carga mientras se descarga la app (en el celular puede
       tardar unos segundos la primera vez). */
    html, body { margin: 0; height: 100%; background: #FAF7F0; }
    #carga {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font-family: -apple-system, system-ui, sans-serif;
      color: #1C2421; transition: opacity .3s;
    }
    #carga .mate { font-size: 64px; animation: latido 1.2s ease-in-out infinite; }
    #carga p { margin: 0; font-size: 18px; font-weight: 700; }
    @keyframes latido { 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { #carga .mate { animation: none; } }
    /* Mismo fondo de los costados que usa la app en pantallas anchas. */
    @media (min-width: 528px) { html, body { background: #ECE6D8; } }
  </style>
</head>
<body>
  <div id="carga" role="status">
    <div class="mate" aria-hidden="true">🧉</div>
    <p>Cargando Ñe'ẽ…</p>
  </div>
  <script>
    // Se saca la pantalla de carga cuando Flutter dibuja el primer frame.
    window.addEventListener('flutter-first-frame', function () {
      var carga = document.getElementById('carga');
      if (!carga) return;
      carga.style.opacity = '0';
      setTimeout(function () { carga.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
